info:
  name: 04 - Consultar empleados con JWT
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/empleados?page=0&size=10"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
